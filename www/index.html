<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Словарь сленга</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Словарь сленга">
<style>
:root{--bg:#090d16;--card:#131a2b;--card2:#1a2338;--line:#243049;--text:#e8edf7;--mut:#8b97b3;--acc:#7c6cf0;--acc2:#b36bf5;--gold:#fbbf24;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(24px + var(--sb))}
header{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 85%,transparent);padding:calc(14px + var(--st)) 16px 8px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:12px;color:var(--mut);margin-top:2px}
.dice{border:0;background:var(--card2);color:var(--text);width:42px;height:42px;border-radius:14px;font-size:20px;cursor:pointer}
.dice:active{transform:scale(.94)}
.search{position:relative}
.search input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:13px 40px 13px 42px;font-size:16px;outline:none}
.search input:focus{border-color:var(--acc)}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:16px;pointer-events:none}
.search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);font-size:18px;width:34px;height:34px;display:none;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--mut);padding:8px 13px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;font-weight:600}
.wod{margin:6px 16px 4px;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,#2a2166,#4a1d7a);cursor:pointer}
.wod small{display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#cbbfff;margin-bottom:4px}
.wod b{font-size:20px}
.wod p{margin:4px 0 0;font-size:14px;color:#e6defc}
.letter{padding:14px 20px 4px;font-size:13px;font-weight:800;color:var(--acc);letter-spacing:1px}
.item{margin:6px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.row .t{flex:1;min-width:0}
.row .w{font-size:17px;font-weight:700}
.row .p{font-size:13px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.open .p{display:none}
.star{border:0;background:none;font-size:22px;color:#3b4764;cursor:pointer;padding:4px 6px}
.star.on{color:var(--gold)}
.det{display:none;padding:0 14px 14px}
.item.open .det{display:block}
.det .m{font-size:15px;line-height:1.45;margin-bottom:10px}
.det .e{font-size:13px;color:var(--mut);background:var(--card2);padding:9px 11px;border-radius:10px;line-height:1.4}
.det .e span{color:var(--acc2);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11px;color:var(--mut);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
.empty{text-align:center;color:var(--mut);padding:50px 20px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
.mask.on{display:flex}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + var(--sb));border-top:1px solid var(--line)}
.sheet h2{margin:0 0 6px;font-size:28px}
.sheet .m{font-size:16px;line-height:1.45;margin:8px 0 12px}
.sheet .e{font-size:13px;color:var(--mut)}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:0;padding:13px;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.btn.g{background:var(--card2);color:var(--text)}
</style>
</head>
<body>
<div class="app">
 <header>
  <div class="top">
   <div><h1>Словарь сленга</h1><div class="sub" id="cnt"></div></div>
   <button class="dice" id="dice" aria-label="Случайное слово">🎲</button>
  </div>
  <div class="search">

   <input id="q" type="search" placeholder="Найти слово или значение" autocomplete="off" autocapitalize="off" spellcheck="false">
   <button class="x" id="x" aria-label="Очистить">✕</button>
  </div>
  <div class="chips" id="chips"></div>
 </header>
 <div id="wodBox"></div>
 <main id="list"></main>
</div>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>

const CATS = ["Основное", "Дружба и неформальное общение", "Симпатия, любовь и отношения", "Конфликты и негативное общение", "Оценка человека и его поведения", "Одобрение, неодобрение и эмоциональная реакция", "Социальные сети и интернет-общение", "Игры и игровое общение", "Деньги, покупки и цифровая жизнь"];
const norm = s => s.toLowerCase().replace(/ё/g,'е');
let fav = new Set();
try { fav = new Set(JSON.parse(localStorage.getItem('slangFav')||'[]')); } catch(e){}
const saveFav = () => { try { localStorage.setItem('slangFav', JSON.stringify([...fav])); } catch(e){} };
let cat = 'Все', query = '';
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function buildChips(){
  const names = ['Все','★ Избранное', ...CATS];
  $('chips').innerHTML = names.map(n => `<button class="chip${n===cat?' on':''}" data-c="${esc(n)}">${esc(n)}</button>`).join('');
}
$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  cat = b.dataset.c; buildChips(); render(); window.scrollTo({top:0});
});

function filtered(){
  const q = norm(query.trim());
  return DATA.filter(d => {
    if (cat === '★ Избранное' && !fav.has(d.w)) return false;
    if (cat !== 'Все' && cat !== '★ Избранное' && !d.c.includes(cat)) return false;
    if (!q) return true;
    return norm(d.w).includes(q) || norm(d.m).includes(q) || norm(d.e).includes(q);
  }).sort((a,b) => {
    if (q) { const sa = norm(a.w).startsWith(q)?0:1, sb = norm(b.w).startsWith(q)?0:1; if (sa!==sb) return sa-sb; }
    return norm(a.w).localeCompare(norm(b.w),'ru');
  });
}

function itemHTML(d){
  return `<div class="item" data-w="${esc(d.w)}">
    <div class="row"><div class="t"><div class="w">${esc(d.w)}</div><div class="p">${esc(d.m)}</div></div>
    <button class="star${fav.has(d.w)?' on':''}" data-s="1" aria-label="В избранное">${fav.has(d.w)?'★':'☆'}</button></div>
    <div class="det"><div class="m">${esc(d.m)}</div>
    <div class="e"><span>Происхождение:</span> ${esc(d.e)}</div>
    <div class="tags">${d.c.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div></div></div>`;
}

function render(){
  const list = filtered();
  $('cnt').textContent = list.length === DATA.length ? `${DATA.length} слов` : `Найдено: ${list.length} из ${DATA.length}`;
  if (!list.length){
    $('list').innerHTML = `<div class="empty">${cat==='★ Избранное'&&!query?'Пока ничего нет.<br>Нажмите ☆ у слова, чтобы добавить.':'Ничего не найдено'}</div>`;
    return;
  }
  let html = '', last = '';
  for (const d of list){
    if (!query){ const L = norm(d.w)[0].toUpperCase(); if (L!==last){ html += `<div class="letter">${L}</div>`; last = L; } }
    html += itemHTML(d);
  }
  $('list').innerHTML = html;
}

$('list').addEventListener('click', e => {
  const item = e.target.closest('.item'); if(!item) return;
  const w = item.dataset.w;
  if (e.target.closest('[data-s]')){
    fav.has(w) ? fav.delete(w) : fav.add(w); saveFav();
    if (cat === '★ Избранное') render();
    else { const b = item.querySelector('.star'); b.classList.toggle('on', fav.has(w)); b.textContent = fav.has(w)?'★':'☆'; }
    return;
  }
  item.classList.toggle('open');
});

$('q').addEventListener('input', e => { query = e.target.value; $('x').style.display = query ? 'block' : 'none'; render(); });
$('x').addEventListener('click', () => { $('q').value=''; query=''; $('x').style.display='none'; render(); $('q').focus(); });

// Слово дня
const dayIdx = Math.floor(Date.now()/86400000) % DATA.length;
function showWod(){
  const d = DATA[dayIdx];
  $('wodBox').innerHTML = `<div class="wod" id="wod"><small>Слово дня</small><b>${esc(d.w)}</b><p>${esc(d.m)}</p></div>`;
  $('wod').onclick = () => openSheet(d);
}

// Окно слова
let cur = null;
function openSheet(d){
  cur = d;
  $('sheet').innerHTML = `<h2>${esc(d.w)}</h2><div class="m">${esc(d.m)}</div><div class="e"><b>Происхождение:</b> ${esc(d.e)}</div>
   <div class="btns"><button class="btn g" id="sFav">${fav.has(d.w)?'★ В избранном':'☆ В избранное'}</button><button class="btn" id="sNext">🎲 Ещё</button></div>`;
  $('mask').classList.add('on');
  $('sFav').onclick = () => { fav.has(d.w)?fav.delete(d.w):fav.add(d.w); saveFav(); openSheet(d); render(); };
  $('sNext').onclick = randomWord;
}
function randomWord(){ let d; do { d = DATA[Math.floor(Math.random()*DATA.length)]; } while (cur && d===cur && DATA.length>1); openSheet(d); }
$('dice').onclick = randomWord;
$('mask').addEventListener('click', e => { if (e.target.id==='mask') $('mask').classList.remove('on'); });

buildChips(); showWod(); render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
